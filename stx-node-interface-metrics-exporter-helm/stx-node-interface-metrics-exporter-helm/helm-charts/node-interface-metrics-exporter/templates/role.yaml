---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: {{ .Values.labels.app }}
  name: {{ .Values.name }}-sa
  namespace: {{ .Values.namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: {{ .Values.labels.app }}
  name: {{ .Values.name }}-cluster-role
  # "namespace" omitted since ClusterRoles are not namespaced
rules:
- apiGroups: [""] # core API group
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
